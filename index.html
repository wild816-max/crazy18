        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="member-roster-grid"></div>
    </div>

    <!-- 出賽配重 -->
    <div id="tactics-section" class="hidden space-y-5">
        <div class="bg-stone-900 p-4 rounded-2xl border border-stone-800">
            <div class="flex flex-wrap justify-between items-center gap-3">
                <div class="flex gap-2"><button onclick="setBoatType('small')" id="boat-small-btn" class="px-4 py-2 rounded-xl bg-red-600 text-sm font-bold">小龍 (10槳)</button><button onclick="setBoatType('medium')" id="boat-medium-btn" class="px-4 py-2 rounded-xl bg-stone-800 text-sm font-bold">中龍 (20槳)</button></div>

            </div>

                </div>
                <div class="md:col-span-2 bg-stone-950 rounded-2xl p-3 border border-stone-800">

                    <div class="text-center text-xs text-red-400 mt-4 mb-1">🎏 龍尾 (舵手)</div>

    </div>
</main>

<!-- 管理員登入 Modal -->
<div id="admin-login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">

</div>

function importPracticeFromSheet(csv) {
    const lines = csv.split(/\r?\n/);
    if (lines.length < 2) { alert('CSV 至少包含標題列和一行數據'); return; }

    // 解析标题行，兼容 BOM 头
    let headerLine = lines[0].trim();
    if (headerLine.charCodeAt(0) === 0xFEFF) headerLine = headerLine.slice(1);
    const headers = headerLine.split(',').map(h => h.trim());
    
    const dateIdx = headers.findIndex(h => h.includes('日期'));
    const distIdx = headers.findIndex(h => h.includes('距離') || h.toLowerCase().includes('km'));
    const hoursIdx = headers.findIndex(h => h.includes('時數') || h.includes('小時') || h.toLowerCase().includes('h'));
    const membersIdx = headers.findIndex(h => h.includes('出席') || h.includes('隊員'));
    
    if (dateIdx === -1 || distIdx === -1 || hoursIdx === -1 || membersIdx === -1) {
        alert(`CSV 標題列缺少必要欄位。找到的欄位：${headers.join(', ')}\n需要包含：日期, 距離, 時數, 出席隊員`);
        return;
    }

    // ========== 輔助函數 ==========
    // 日期轉換：2026年5月28日 → 2026-05-28
    function parseDateToYMD(dateStr) {
        let match = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
        if (match) {
            let year = match[1], month = match[2].padStart(2,'0'), day = match[3].padStart(2,'0');
            return `${year}-${month}-${day}`;
        }
        // 支援 2026/5/28 或 2026-5-28
        let match2 = dateStr.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (match2) {
            let year = match2[1], month = match2[2].padStart(2,'0'), day = match2[3].padStart(2,'0');
            return `${year}-${month}-${day}`;
        }
        return null;
    }

    // 距離轉換：5,501 公尺 → 5.501 km；8.86 km → 8.86
    function parseDistanceToKm(distStr) {
        let numMatch = distStr.match(/(\d+(?:[.,]\d+)?)/);
        if (!numMatch) return NaN;
        let num = parseFloat(numMatch[1].replace(',', '.'));
        if (distStr.includes('公尺') || distStr.includes('米')) {
            return num / 1000;
        }
        return num;
    }

    // 時間轉換：1:01:23 → 1.023 小時；1小時30分 → 1.5
    function parseTimeToHours(timeStr) {
        // 格式 HH:MM:SS
        let parts = timeStr.split(':');
        if (parts.length === 3) {
            let h = parseInt(parts[0]), m = parseInt(parts[1]), s = parseInt(parts[2]);
            if (!isNaN(h) && !isNaN(m) && !isNaN(s)) return h + m/60 + s/3600;
        }
        // 格式 1小時30分
        let match = timeStr.match(/(\d+)\s*小時\s*(\d+)\s*分/);
        if (match) {
            return parseInt(match[1]) + parseInt(match[2])/60;
        }
        // 純小時小數
        let hourNum = parseFloat(timeStr);
        if (!isNaN(hourNum)) return hourNum;
        return NaN;
    }

    // ========== 處理每一行 ==========
    let importedCount = 0, skipCount = 0;
    const failedNames = new Set(); // 記錄未匹配到的隊員名

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        
        const cols = line.split(',').map(c => c.trim());
        if (cols.length < 4) {
            skipCount++;
            continue;
        }

        const rawDate = cols[dateIdx];
        const rawDist = cols[distIdx];
        const rawHours = cols[hoursIdx];
        let memberNames = cols[membersIdx].split(/[,;、]+/).map(n => n.trim()).filter(n => n);

        const date = parseDateToYMD(rawDate);
        const dist = parseDistanceToKm(rawDist);
        const hours = parseTimeToHours(rawHours);

        if (!date || isNaN(dist) || isNaN(hours) || memberNames.length === 0) {
            skipCount++;
            continue;
        }

        // 匹配隊員（不區分大小寫，去除空白）
        const attendees = [];
        for (let name of memberNames) {
            const member = members.find(m => 
                m.name === name || 
                m.name.toLowerCase() === name.toLowerCase() ||
                m.name === name.replace(/\s/g, '')
            );
            if (member) {
                attendees.push(member.id);
            } else {
                failedNames.add(name);
                console.warn(`未找到隊員: ${name}`);
            }
        }

        if (attendees.length === 0) {
            skipCount++;
            continue;
        }

        practices.push({
            id: 'p_' + Date.now() + '_' + i + '_' + Math.random(),
            date: date,
            distance: dist,
            hours: hours,
            attendees: attendees
        });
        importedCount++;
    }

    if (importedCount > 0) {
        saveAll();
        renderAdminPracticeList();
        renderRoster();
        renderRanking();
        let warnMsg = '';
        if (failedNames.size > 0) {
            warnMsg = `\n\n⚠️ 以下隊員在系統中不存在，請先新增他們：\n${Array.from(failedNames).join(', ')}`;
        }
        alert(`成功匯入 ${importedCount} 筆操練紀錄，跳過 ${skipCount} 筆無效資料。${warnMsg}`);
    } else {
        alert(`沒有匯入任何操練紀錄。可能原因：\n1. 隊員姓名不存在系統中（請檢查「隊員資料庫」）\n2. CSV 格式錯誤（請確保標題列為：日期,距離,時數,出席隊員）\n3. 日期/距離/時間格式不支援`);
    }
}

    async function handleOcrImage(file) {
        const { data: { text } } = await Tesseract.recognize(file, 'chi_tra+eng');
        let dist = null, hours = null;
        let kmMatch = text.match(/(\d+(?:[.,]\d+)?)\s*[公]?里|(\d+(?:[.,]\d+)?)\s*km/i);
        if(kmMatch) dist = parseFloat((kmMatch[1]||kmMatch[2]).replace(',','.'));
        let timeMatch = text.match(/(\d+):(\d+):(\d+)/);
        if(timeMatch) hours = parseInt(timeMatch[1]) + parseInt(timeMatch[2])/60 + parseInt(timeMatch[3])/3600;
        document.getElementById('ocr-distance').value = dist || '';
        document.getElementById('ocr-hours').value = hours ? hours.toFixed(2) : '';
        document.getElementById('ocr-date').value = new Date().toISOString().slice(0,10);
        let matchedIds = [];
        members.forEach(m => { if(text.includes(m.name)) matchedIds.push(m.id); });
        let attendDiv = document.getElementById('ocr-attendees-list');
        attendDiv.innerHTML = members.map(m => `<label><input type="checkbox" value="${m.id}" class="ocr-attend-cb" ${matchedIds.includes(m.id) ? 'checked' : ''}> ${m.name}</label>`).join('');
        document.getElementById('ocr-preview-area').innerHTML = `✅ 辨識完成 距離:${dist||'?'}km 時數:${hours?.toFixed(2)||'?'}h 自動比對${matchedIds.length}人`;
        document.getElementById('ocr-result-card').classList.remove('hidden');
    }

        let steersmanM = currentBoatSetup['steersman'] ? members.find(m=>m.id===currentBoatSetup['steersman']) : null;
        drumDiv.innerHTML = drummerM ? `🥁 ${drummerM.avatar} ${drummerM.name}` : '🥁 鼓手座位 (點擊放置)';
        steerDiv.innerHTML = steersmanM ? `🧭 ${steersmanM.avatar} ${steersmanM.name}` : '🧭 舵手座位 (點擊放置)';
        calcAndShowWeight();
    }
    function selectMemberForBoat(id) { selectedMemberForSeat = id; renderTacticsUI(); }
    function tryPlaceSeat(seatKey) { if(!selectedMemberForSeat) alert('請先點擊左側隊員選中'); else { currentBoatSetup[seatKey] = selectedMemberForSeat; selectedMemberForSeat = null; renderTacticsUI(); } }
    function clearAllSeats() { currentBoatSetup = {}; selectedMemberForSeat = null; renderTacticsUI(); }
    function setBoatType(type) { boatType = type; clearAllSeats(); document.getElementById('boat-small-btn').className = type==='small' ? 'px-4 py-2 rounded-xl bg-red-600 text-sm font-bold' : 'px-4 py-2 rounded-xl bg-stone-800 text-sm font-bold'; document.getElementById('boat-medium-btn').className = type==='medium' ? 'px-4 py-2 rounded-xl bg-red-600 text-sm font-bold' : 'px-4 py-2 rounded-xl bg-stone-800 text-sm font-bold'; }
    function autoBalanceByAI() { let paddlers = members.filter(m => m.primaryRole.includes('槳手')); if(paddlers.length===0) { alert('無槳手'); return; } paddlers.sort((a,b)=>b.weight-a.weight); let newSetup = {}; let max = boatType==='small' ? 5 : 10; let leftIdx=1, rightIdx=1, leftW=0, rightW=0; paddlers.forEach(p => { if(leftW <= rightW && leftIdx <= max) { newSetup[`port_${leftIdx++}`] = p.id; leftW += p.weight; } else if(rightIdx <= max) { newSetup[`starboard_${rightIdx++}`] = p.id; rightW += p.weight; } }); let drummer = members.find(m=>m.primaryRole==='鼓手'); if(drummer) newSetup.drummer = drummer.id; let steer = members.find(m=>m.primaryRole==='舵手'); if(steer) newSetup.steersman = steer.id; currentBoatSetup = newSetup; selectedMemberForSeat = null; renderTacticsUI(); alert('AI 平衡配重完成'); }
    function calcAndShowWeight() { let left=0, right=0; Object.entries(currentBoatSetup).forEach(([k,id])=>{ let m=members.find(x=>x.id===id); if(m){ if(k.startsWith('port')) left+=m.weight; if(k.startsWith('starboard')) right+=m.weight; } }); document.getElementById('weight-port-display').innerText=left; document.getElementById('weight-starboard-display').innerText=right; document.getElementById('balance-tip').innerHTML = Math.abs(left-right)<=5 ? '⚖️ 完美平衡' : (left>right ? '⚠️ 左舷偏重' : '⚠️ 右舷偏重'); }
    function openSheetImport(){ let url=prompt('貼上 Google Sheet CSV 連結 (標題:姓名,主崗位,副崗位,體重,頭像)'); if(url) fetch(url).then(r=>r.text()).then(csv=>{ let rows=csv.split(/\r?\n/).slice(1).filter(r=>r.trim()); let newMembers=[]; rows.forEach((row,i)=>{ let cols=row.split(','); if(cols.length>=5){ let name=cols[0]?.trim(), primary=cols[1]?.trim(), secondary=cols[2]?.trim(), weight=parseInt(cols[3]), avatar=cols[4]?.trim()||'💪'; if(name&&primary&&weight) newMembers.push({id:'m_'+Date.now()+i,name,primaryRole:primary,secondaryRole:secondary||'無',weight,avatar,cheers:0}); } }); if(newMembers.length){ members=newMembers; saveAll(); renderAdminMemberTable(); renderRoster(); renderRanking(); renderTacticsUI(); alert(`匯入 ${newMembers.length} 位隊員`); } else alert('無效資料格式'); }).catch(()=>alert('無法讀取CSV')); }
    
    // 登入 & 面板
    function openAdminLogin(){ document.getElementById('admin-login-modal').classList.remove('hidden'); }
    function closeAdminModal(){ document.getElementById('admin-login-modal').classList.add('hidden'); }
    function checkAdminLogin(){ let pwd=document.getElementById('admin-pwd').value; if(pwd==='dragon2026'){ closeAdminModal(); document.getElementById('admin-panel').classList.remove('hidden'); renderAdminMemberTable(); renderAdminPracticeList(); renderAdminRaceTable(); } else alert('密碼錯誤'); }
    function closeAdminPanel(){ document.getElementById('admin-panel').classList.add('hidden'); }
    function switchMainTab(tab){ ['roster','tactics','records','rank'].forEach(t=>document.getElementById(`${t}-section`).classList.add('hidden')); document.getElementById(`${tab}-section`).classList.remove('hidden'); if(tab==='tactics') renderTacticsUI(); if(tab==='records') renderRaceTable(); ['roster','tactics','records','rank'].forEach(t=>{ let btn=document.getElementById(`tab-${t}`); if(t===tab) btn.className="px-3 py-1.5 text-xs font-black rounded-xl bg-red-600 text-white shadow"; else btn.className="px-3 py-1.5 text-xs font-black rounded-xl text-stone-400"; }); }
    loadData(); renderRoster(); renderRanking(); renderRaceTable(); setBoatType('small'); switchMainTab('roster');
</script>
